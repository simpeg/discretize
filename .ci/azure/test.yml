jobs:
  - job:
    strategy:
      matrix:
        linux-Python312:
          image: ubuntu-latest
          python.version: "3.12"
        linux-Python313:
          image: ubuntu-latest
          python.version: "3.13"
          coverage: True
        linux-Python314:
          image: ubuntu-latest
          python.version: "3.14"
        linux-Python314t:
          image: ubuntu-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
        linux-Python315:
          image: ubuntu-latest
          python.version: "3.15"
          environ.bare: True
        osx-Python312:
          image: macOS-latest
          python.version: "3.12"
        osx-Python313:
          image: macOS-latest
          python.version: "3.13"
        osx-Python314:
          image: macOS-latest
          python.version: "3.14"
        osx-Python314t:
          image: macOS-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
        osx-Python315:
          image: macOS-latest
          python.version: "3.15"
          environ.bare: True
        win-Python312:
          image: windows-latest
          python.version: "3.12"
        win-Python313:
          image: windows-latest
          python.version: "3.13"
        win-Python314:
          image: windows-latest
          python.version: "3.14"
        win-Python314t:
          image: windows-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
        win-Python315:
          image: windows-latest
          python.version: "3.15"
          environ.bare: True
    displayName: "${{ variables.image }} ${{ variables.python.version }}"
    pool:
      vmImage: $(image)
    variables:
      varOS: $(Agent.OS)
      ARCH: $(Agent.OSArchitecture)
    steps:
      - bash: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv

      - bash: .ci/azure/setup_env.sh
        displayName: Setup discretize environment

      - bash: .ci/azure/run_tests.sh
        displayName: "Testing"

      - bash: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov
        displayName: "Upload coverage to codecov.io"
        condition: variables.coverage
