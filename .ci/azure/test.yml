jobs:
  - job:
    strategy:
      matrix:
        linux-Python312:
          image: ubuntu-latest
          python.version: "3.12"
        linux-Python313:
          image: ubuntu-latest
          python.version: "3.13"
          coverage: True
        linux-Python313t:
          image: ubuntu-latest
          python.version: "3.13"
          environ.bare: True
          python.freethreading: True
          coverage: True
        linux-Python314:
          image: ubuntu-latest
          environ.bare: True
          python.version: "3.14"
        linux-Python314t:
          image: ubuntu-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
        osx-Python312:
          image: macOS-latest
          python.version: "3.12"
        osx-Python313:
          image: macOS-latest
          python.version: "3.13"
        osx-Python313t:
          image: macOS-latest
          python.version: "3.13"
          python.freethreading: True
        osx-Python314:
          image: macOS-latest
          python.version: "3.14"
          environ.bare: True
        osx-Python314t:
          image: macOS-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
        win-Python312:
          image: windows-latest
          python.version: "3.12"
        win-Python313:
          image: windows-latest
          python.version: "3.13"
        win-Python313t:
          image: windows-latest
          python.version: "3.13"
          environ.bare: True
          python.freethreading: True
        win-Python314:
          image: windows-latest
          environ.bare: True
          python.version: "3.14"
        win-Python314t:
          image: windows-latest
          python.version: "3.14"
          environ.bare: True
          python.freethreading: True
    displayName: "${{ variables.image }} ${{ variables.python.version }}"
    pool:
      vmImage: $(image)
    variables:
      varOS: $(Agent.OS)
      ARCH: $(Agent.OSArchitecture)
    steps:
      - bash: .ci/azure/setup_miniconda_macos.sh
        displayName: Install miniconda on mac
        condition: eq(variables.varOS, 'Darwin')

      - bash: echo "##vso[task.prependpath]$CONDA/bin"
        displayName: Add conda to PATH
        condition: ne(variables.varOS, 'Windows_NT')

      - powershell: Write-Host "##vso[task.prependpath]$env:CONDA\Scripts"
        displayName: Add conda to PATH
        condition: eq(variables.varOS, 'Windows_NT')

      - bash: .ci/azure/setup_env.sh
        displayName: Setup discretize environment

      - bash: .ci/azure/run_tests.sh
        displayName: "Testing"

      - bash: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov
        displayName: "Upload coverage to codecov.io"
        condition: variables.coverage

  # Python 3.15 is still pre-release (rc). This job pulls from conda-forge's
  # python_rc label via PYTHON_RELEASE_CANDIDATE and is allowed to fail so
  # upstream rc package gaps don't block unrelated PRs. Merge it into the
  # main matrix above once 3.15 goes final and stabilizes.
  - job:
    continueOnError: true
    strategy:
      matrix:
        linux-Python315:
          image: ubuntu-latest
          python.version: "3.15"
          environ.bare: True
          python.release_candidate: True
        osx-Python315:
          image: macOS-latest
          python.version: "3.15"
          environ.bare: True
          python.release_candidate: True
        win-Python315:
          image: windows-latest
          python.version: "3.15"
          environ.bare: True
          python.release_candidate: True
    displayName: "${{ variables.image }} ${{ variables.python.version }} (rc)"
    pool:
      vmImage: $(image)
    variables:
      varOS: $(Agent.OS)
      ARCH: $(Agent.OSArchitecture)
    steps:
      - bash: .ci/azure/setup_miniconda_macos.sh
        displayName: Install miniconda on mac
        condition: eq(variables.varOS, 'Darwin')

      - bash: echo "##vso[task.prependpath]$CONDA/bin"
        displayName: Add conda to PATH
        condition: ne(variables.varOS, 'Windows_NT')

      - powershell: Write-Host "##vso[task.prependpath]$env:CONDA\Scripts"
        displayName: Add conda to PATH
        condition: eq(variables.varOS, 'Windows_NT')

      - bash: .ci/azure/setup_env.sh
        displayName: Setup discretize environment

      - bash: .ci/azure/run_tests.sh
        displayName: "Testing"
