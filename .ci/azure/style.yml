jobs:
  - job:
    displayName: Check version consistency
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
      - bash: pip install pre-commit
        displayName: "Install pre-commit"
      - bash: pre-commit run check-version-sync --all-files
        displayName: "Check versions"

  - job:
    displayName: Run style checks with Black
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
      - bash: pip install pre-commit
        displayName: "Install pre-commit"
      - bash: pre-commit run black --all-files
        displayName: "Run black"

  - job:
    displayName: Run (permissive) style checks with flake8
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
      - bash: pip install pre-commit
        displayName: "Install pre-commit"
      - bash: pre-commit run flake8 --all-files
        displayName: "Run flake8"
