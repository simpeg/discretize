jobs:
  - job:
    displayName: Check version consistency
    pool:
      vmImage: ubuntu-latest
    steps:
      - bash: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv
      - bash: uv run --no-project --with pyyaml -- python .ci/check_version_sync.py
        displayName: "Check versions"

  - job:
    displayName: Run style checks with Black
    pool:
      vmImage: ubuntu-latest
    steps:
      - bash: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv
      - bash: .ci/install_style.sh
        displayName: "Install dependencies to run the checks"
      - bash: uv run --no-sync -- black --check .
        displayName: "Run black"

  - job:
    displayName: Run (permissive) style checks with flake8
    pool:
      vmImage: ubuntu-latest
    steps:
      - bash: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv
      - bash: .ci/install_style.sh
        displayName: "Install dependencies to run the checks"
      - bash: uv run --no-sync -- flake8
        displayName: "Run flake8"
